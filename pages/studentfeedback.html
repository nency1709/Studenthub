<!DOCTYPE html>
<html>
<head>
    <title>Faculty Feedback Form</title>
</head>
<body>

    <h2>Faculty Feedback Form</h2>

    <form>
 <label>Name:</label><br>
 <input type="text" placeholder="Enter your name"><br><br>

   <label>Faculty Name:</label><br>
   <input type="text" placeholder="Enter faculty name"><br><br>

   <label>Rating:</label><br>
  <select>
  <option>Excellent</option>
   <option>Good</option>
  <option>Average</option>
  <option>Poor</option>
 </select><br><br>

 <label>Feedback:</label><br>
 <textarea rows="4" cols="30" placeholder="Write your feedback"></textarea><br><br>

 <input type="submit" value="Submit">
   <input type="reset" value="Reset">
    </form>

</body>
</html>
